name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/mpc
      # arm64 ARC scale-set is paused (DOKS has no arm64 droplets — see
      # ~/work/hanzo/CLAUDE.md). amd64-only until DO ships arm64.
      platforms: linux/amd64
    secrets: inherit

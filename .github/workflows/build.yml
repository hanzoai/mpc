name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Canonical image name for the Hanzo MPC daemon. Per the global
  # container-registry rule (~/.claude/CLAUDE.md), Hanzo images live on
  # GHCR — never GAR. Mirrors hanzoai/tasks one-package-per-repo shape.
  REGISTRY: ghcr.io/hanzoai/mpc

jobs:
  build-amd64:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Compute tags
        id: tags
        run: |
          SHA=${GITHUB_SHA::8}
          REF=${GITHUB_REF_NAME}
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "semver=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Build + push
        run: |
          IMG=${REGISTRY}:${{ steps.tags.outputs.ref }}-amd64
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.TOKEN_GITHUB_CICD }} \
            -t $IMG \
            -t ${REGISTRY}:${{ steps.tags.outputs.sha }}-amd64 \
            .
          docker push $IMG
          docker push ${REGISTRY}:${{ steps.tags.outputs.sha }}-amd64

  build-arm64:
    # Native arm64 on the AWS EKS hanzo-arm64 (t4g.xlarge Graviton2)
    # scaleset. DOKS has no arm64 nodes; the same scaleset hanzoai/tasks
    # uses serves this build.
    runs-on: hanzo-build-linux-arm64
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Compute tags
        id: tags
        run: |
          SHA=${GITHUB_SHA::8}
          REF=${GITHUB_REF_NAME}
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT

      - name: Build + push
        run: |
          IMG=${REGISTRY}:${{ steps.tags.outputs.ref }}-arm64
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.TOKEN_GITHUB_CICD }} \
            -t $IMG \
            -t ${REGISTRY}:${{ steps.tags.outputs.sha }}-arm64 \
            .
          docker push $IMG
          docker push ${REGISTRY}:${{ steps.tags.outputs.sha }}-arm64

  manifest:
    needs: [build-amd64, build-arm64]
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Compute tags
        id: tags
        run: |
          SHA=${GITHUB_SHA::8}
          REF=${GITHUB_REF_NAME}
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "semver=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Create manifests
        run: |
          set -e
          REF=${{ steps.tags.outputs.ref }}
          SHA=${{ steps.tags.outputs.sha }}

          arches_for() {
            local tag="$1"
            local arches=""
            for a in amd64 arm64; do
              if docker buildx imagetools inspect "${REGISTRY}:${tag}-${a}" >/dev/null 2>&1; then
                arches="${arches} ${REGISTRY}:${tag}-${a}"
              fi
            done
            echo "${arches}"
          }

          REF_SRCS=$(arches_for "${REF}")
          SHA_SRCS=$(arches_for "${SHA}")

          docker buildx imagetools create --tag "${REGISTRY}:${REF}" ${REF_SRCS}
          docker buildx imagetools create --tag "${REGISTRY}:${SHA}" ${SHA_SRCS}

          if [ "$REF" = "main" ]; then
            docker buildx imagetools create --tag "${REGISTRY}:latest" ${REF_SRCS}
          fi

      - name: Tag semver (on version tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          VER=${{ steps.tags.outputs.semver }}
          arches=""
          for a in amd64 arm64; do
            if docker buildx imagetools inspect "${REGISTRY}:${GITHUB_REF_NAME}-${a}" >/dev/null 2>&1; then
              arches="${arches} ${REGISTRY}:${GITHUB_REF_NAME}-${a}"
            fi
          done
          docker buildx imagetools create --tag "${REGISTRY}:${VER}" ${arches}
